schema: spec-driven

context: |
  Tech stack: Java 21 + JavaFX 21 (FXML) + EclipseLink 4.0 (JPA) + H2 in-memory
  Architecture: Layered (domain/application/infrastructure/presentation)
  Testing: JUnit 5 via Maven Surefire
  Style: Standard Java, Maven build, package com.eazyplan

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Document architecture decisions with rationale
    - Respect layered architecture boundaries
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns and package structure
    - JPA entities in domain/entities, repositories in domain/repositories
    - Services in domain/services, persistence in infrastructure/persistence
    - Controllers in presentation/controllers, views in resources/presentation/views
  tdd: true
  test_command: "mvn test"
  verify:
    test_command: "mvn test"
    build_command: "mvn compile"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

testing:
  strict_tdd: true
  runner: maven-surefire
  framework: junit-jupiter 5.10.2
  command: "mvn test"
  layers:
    unit:
      available: true
      tool: JUnit 5
    integration:
      available: false
      tool: "—"
    e2e:
      available: false
      tool: "—"
  coverage:
    available: false
    command: "—"
  quality:
    linter:
      available: false
      command: "—"
    type_checker:
      available: false
      command: "—"
    formatter:
      available: false
      command: "—"
