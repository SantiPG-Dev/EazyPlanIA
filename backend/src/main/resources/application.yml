spring:
  application:
    name: eazyplan-backend

  # Paso 3: PostgreSQL 16 (contenedor Docker). Flyway gestiona el esquema.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:eazyplan}
    username: ${DB_USER:eazyplan}
    password: ${DB_PASSWORD:eazyplan}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway crea el esquema; Hibernate solo lo valida
    properties:
      hibernate:
        format_sql: true
        jdbc.time_zone: UTC
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

eazyplan:
  security:
    jwt:
      secret: ${JWT_SECRET:Y2FtYmlhLWVzdGEtY2xhdmUtdXNhLTI1Ni1iaXRzLWVuLXByb2R1Y2Npb24=}
      expiration-minutes: 60
  ai:
    base-url: ${AI_BASE_URL:http://localhost:1234}
    model: ${AI_MODEL:ornith-1.0-9b}

logging:
  level:
    org.hibernate.SQL: warn
