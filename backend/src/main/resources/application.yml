spring:
  application:
    name: eazyplan-backend

  # Paso 3: PostgreSQL 16 (contenedor Docker). Flyway gestiona el esquema.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:eazyplan}
    username: ${DB_USER:eazyplan}
    password: ${DB_PASSWORD:eazyplan}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway crea el esquema; Hibernate solo lo valida
    properties:
      hibernate:
        format_sql: true
        jdbc.time_zone: UTC
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: warn
