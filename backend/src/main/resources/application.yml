spring:
  application:
    name: eazyplan-backend

  # Paso 1: H2 en memoria para desarrollo.
  # El Paso 3 cambia a PostgreSQL + Flyway (ddl-auto: validate).
  datasource:
    url: jdbc:h2:mem:eazyplan;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        jdbc.time_zone: UTC
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: warn
