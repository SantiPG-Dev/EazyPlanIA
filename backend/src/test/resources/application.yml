# Configuración de tests: H2 en memoria (sin Docker, sin PostgreSQL).
# Este archivo sustituye al application.yml principal durante los tests
# porque src/test/resources va antes en el classpath.
spring:
  application:
    name: eazyplan-backend-test

  datasource:
    url: jdbc:h2:mem:eazyplan-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        jdbc.time_zone: UTC
    open-in-view: false

  # Flyway deshabilitado en tests: Hibernate crea el esquema con create-drop.
  flyway:
    enabled: false

  h2:
    console:
      enabled: false

server:
  port: 0

eazyplan:
  security:
    jwt:
      secret: dGVzdC1zZWNyZXQta2V5LWZvci1qd3QtaW4tdGVzdHMtbm90LWZvci1wcm9kdWN0aW9u
      expiration-minutes: 60

logging:
  level:
    org.hibernate.SQL: warn
