# Docker Compose para EazyPlanIA — todos los servicios de producción.
#
# Uso:
#   docker compose up --build   (construye y arranca)
#   docker compose up -d        (modo detached)
#   http://localhost:5173        (frontend)
#   http://localhost:8080        (API backend)

services:
  db:
    image: postgres:16-alpine
    container_name: eazyplan-db
    environment:
      POSTGRES_DB: eazyplan
      POSTGRES_USER: eazyplan
      POSTGRES_PASSWORD: eazyplan
    ports:
      - "5432:5432"
    volumes:
      - eazyplan-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eazyplan -d eazyplan"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eazyplan-backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: eazyplan
      DB_USER: eazyplan
      DB_PASSWORD: eazyplan
      JWT_SECRET: Y2FtYmlhLWVzdGEtY2xhdmUtdXNhLTI1Ni1iaXRzLWVuLXByb2R1Y2Npb24=
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eazyplan-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  eazyplan-pgdata:
