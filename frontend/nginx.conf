# Proxy inverso para el frontend React en producción.
# Sirve el estático y redirige /api al backend Docker.

upstream backend {
    server backend:8080;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Estáticos (con caché para rendimiento)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API → backend Docker
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: todas las rutas no encontradas → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
